name: Update AUR package

on:
  workflow_call:
    inputs:
      channel:
        description: Cursor release channel
        required: true
        type: string
      pkgbuild_path:
        description: Channel PKGBUILD path
        required: true
        type: string
      aur_package:
        description: AUR package name
        required: true
        type: string
      force_publish:
        description: Publish the current PKGBUILD even when no update is available
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      plan_status: ${{ steps.prepare.outputs.plan_status }}
      package_version: ${{ steps.prepare.outputs.package_version }}
      package_commit: ${{ steps.prepare.outputs.package_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare candidate PKGBUILD
        id: prepare
        env:
          CHANNEL: ${{ inputs.channel }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
          PKGBUILD_PATH: ${{ inputs.pkgbuild_path }}
        run: |
          prepare_args=(
            scripts/update.ts
            --prepare
            --channel "$CHANNEL"
            --pkgbuild "$PKGBUILD_PATH"
          )
          if [[ "$FORCE_PUBLISH" == "true" ]]; then
            prepare_args+=(--force-publish)
          fi
          bun "${prepare_args[@]}" > preparation_result.json
          cat preparation_result.json

          plan_status=$(jq -er '.plan.status' preparation_result.json)
          echo "plan_status=$plan_status" >> "$GITHUB_OUTPUT"

          case "$plan_status" in
            skip)
              ;;
            publish-current | update-and-publish)
              package_version=$(jq -er '.plan.package.pkgver' preparation_result.json)
              package_commit=$(jq -er '.plan.package.commit' preparation_result.json)
              {
                echo "package_version=$package_version"
                echo "package_commit=$package_commit"
              } >> "$GITHUB_OUTPUT"
              mkdir -p validated
              cp "$PKGBUILD_PATH" validated/PKGBUILD
              ;;
            *)
              echo "Unknown publication plan: $plan_status" >&2
              exit 1
              ;;
          esac

      - name: Upload candidate PKGBUILD
        if: steps.prepare.outputs.plan_status != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-pkgbuild
          path: validated/PKGBUILD
          if-no-files-found: error

      - name: Summary
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish }}
          PACKAGE_COMMIT: ${{ steps.prepare.outputs.package_commit }}
          PACKAGE_VERSION: ${{ steps.prepare.outputs.package_version }}
          PLAN_STATUS: ${{ steps.prepare.outputs.plan_status }}
        run: |
          echo "::group::Update check"
          echo "Publication plan: $PLAN_STATUS"
          echo "Force publish: $FORCE_PUBLISH"
          echo "Package version: $PACKAGE_VERSION"
          echo "Package commit: $PACKAGE_COMMIT"
          echo "::endgroup::"

  smoke:
    name: Native smoke (${{ matrix.architecture }})
    needs: prepare
    if: needs.prepare.outputs.plan_status != 'skip'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download candidate PKGBUILD
        uses: actions/download-artifact@v4
        with:
          name: candidate-pkgbuild
          path: validated

      - name: Install package smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils curl libarchive-tools xz-utils

      - name: Run native package smoke test
        run: scripts/smoke-test-pkgbuild.sh validated/PKGBUILD

  finalize:
    needs:
      - prepare
      - smoke
    if: needs.prepare.outputs.plan_status != 'skip' && needs.smoke.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download validated PKGBUILD
        uses: actions/download-artifact@v4
        with:
          name: candidate-pkgbuild
          path: validated

      - name: Restore validated PKGBUILD
        env:
          PKGBUILD_PATH: ${{ inputs.pkgbuild_path }}
        run: cp validated/PKGBUILD "$PKGBUILD_PATH"

      - name: Commit channel PKGBUILD
        if: needs.prepare.outputs.plan_status == 'update-and-publish'
        env:
          CHANNEL: ${{ inputs.channel }}
          PACKAGE_COMMIT: ${{ needs.prepare.outputs.package_commit }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          PKGBUILD_PATH: ${{ inputs.pkgbuild_path }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$PKGBUILD_PATH"
          git commit -m "Update $CHANNEL PKGBUILD to version $PACKAGE_VERSION (commit $PACKAGE_COMMIT)"
          git push origin "HEAD:$TARGET_REF"

      - name: Prepare PKGBUILD for AUR
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/prepare-aur
        with:
          channel: ${{ inputs.channel }}
          pkgbuild-path: ${{ inputs.pkgbuild_path }}

      - name: Install SSH key
        if: github.ref == 'refs/heads/main'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Publish AUR package
        if: github.ref == 'refs/heads/main'
        env:
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_PACKAGE: ${{ inputs.aur_package }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          CHANNEL: ${{ inputs.channel }}
          PACKAGE_COMMIT: ${{ needs.prepare.outputs.package_commit }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          ./scripts/publish-aur.sh \
            "$AUR_PACKAGE" \
            "Update $CHANNEL to version $PACKAGE_VERSION (commit $PACKAGE_COMMIT)"
