name: Update AUR package

on:
  workflow_call:
    inputs:
      channel:
        description: Cursor release channel
        required: true
        type: string
      force_publish:
        description: Publish the current PKGBUILD even when no update is available
        required: false
        type: boolean
        default: false
    secrets:
      AUR_SSH_PRIVATE_KEY:
        description: SSH private key used to publish AUR packages
        required: true
      KNOWN_HOSTS:
        description: SSH known-hosts entries for the AUR host
        required: true
      AUR_EMAIL:
        description: Email used for AUR commits
        required: true
      AUR_USERNAME:
        description: Username used for AUR commits
        required: true

permissions:
  contents: read

concurrency:
  group: aur-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      plan_status: ${{ steps.prepare.outputs.plan_status }}
      package_version: ${{ steps.prepare.outputs.package_version }}
      package_commit: ${{ steps.prepare.outputs.package_commit }}
      pkgbuild_path: ${{ steps.prepare.outputs.pkgbuild_path }}
      aur_package: ${{ steps.prepare.outputs.aur_package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare candidate PKGBUILD
        id: prepare
        env:
          CHANNEL: ${{ inputs.channel }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          prepare_args=(
            scripts/update.ts
            --prepare
            --channel "$CHANNEL"
          )
          if [[ "$FORCE_PUBLISH" == "true" ]]; then
            prepare_args+=(--force-publish)
          fi
          bun "${prepare_args[@]}" > preparation_result.json
          cat preparation_result.json

          plan_status=$(jq -er '.plan.status' preparation_result.json)
          pkgbuild_path=$(jq -er '.target.pkgbuild_path' preparation_result.json)
          aur_package=$(jq -er '.target.aur_package' preparation_result.json)
          {
            echo "plan_status=$plan_status"
            echo "pkgbuild_path=$pkgbuild_path"
            echo "aur_package=$aur_package"
          } >> "$GITHUB_OUTPUT"

          case "$plan_status" in
            skip)
              ;;
            publish-current | update-and-publish)
              package_version=$(jq -er '.plan.package.pkgver' preparation_result.json)
              package_commit=$(jq -er '.plan.package.commit' preparation_result.json)
              {
                echo "package_version=$package_version"
                echo "package_commit=$package_commit"
              } >> "$GITHUB_OUTPUT"
              mkdir -p validated
              cp "$pkgbuild_path" validated/PKGBUILD
              ;;
            *)
              echo "Unknown publication plan: $plan_status" >&2
              exit 1
              ;;
          esac

      - name: Upload candidate PKGBUILD
        if: steps.prepare.outputs.plan_status != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-pkgbuild
          path: validated/PKGBUILD
          if-no-files-found: error

      - name: Summary
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish }}
          PACKAGE_COMMIT: ${{ steps.prepare.outputs.package_commit }}
          PACKAGE_VERSION: ${{ steps.prepare.outputs.package_version }}
          PLAN_STATUS: ${{ steps.prepare.outputs.plan_status }}
        run: |
          echo "::group::Update check"
          echo "Publication plan: $PLAN_STATUS"
          echo "Force publish: $FORCE_PUBLISH"
          echo "Package version: $PACKAGE_VERSION"
          echo "Package commit: $PACKAGE_COMMIT"
          echo "::endgroup::"

  smoke:
    needs: prepare
    if: needs.prepare.outputs.plan_status != 'skip'
    permissions:
      contents: read
    uses: ./.github/workflows/native-package-smoke.yml
    with:
      pkgbuild_paths: validated/PKGBUILD
      artifact_name: candidate-pkgbuild
      artifact_path: validated

  integrate:
    needs:
      - prepare
      - smoke
    if: needs.prepare.outputs.plan_status != 'skip' && needs.smoke.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      publication_sha: ${{ steps.commit.outputs.publication_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated PKGBUILD
        uses: actions/download-artifact@v4
        with:
          name: candidate-pkgbuild
          path: validated

      - name: Restore validated PKGBUILD
        env:
          PKGBUILD_PATH: ${{ needs.prepare.outputs.pkgbuild_path }}
        run: cp validated/PKGBUILD "$PKGBUILD_PATH"

      - name: Commit channel PKGBUILD
        id: commit
        if: needs.prepare.outputs.plan_status == 'update-and-publish'
        env:
          CHANNEL: ${{ inputs.channel }}
          PACKAGE_COMMIT: ${{ needs.prepare.outputs.package_commit }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          PKGBUILD_PATH: ${{ needs.prepare.outputs.pkgbuild_path }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          # Up-to-date runs reconcile AUR drift, so a later publish failure retries.
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$PKGBUILD_PATH"
          if git diff --cached --quiet -- "$PKGBUILD_PATH"; then
            echo "PKGBUILD already committed; reusing HEAD."
          else
            git commit -m "Update $CHANNEL PKGBUILD to version $PACKAGE_VERSION (commit $PACKAGE_COMMIT)"
            git push origin "HEAD:$TARGET_REF"
          fi
          echo "publication_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-aur:
    needs:
      - prepare
      - integrate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.publication_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare PKGBUILD for AUR
        uses: ./.github/actions/prepare-aur
        with:
          channel: ${{ inputs.channel }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Verify main has not advanced
        env:
          EXPECTED_SHA: ${{ needs.integrate.outputs.publication_sha }}
          TARGET_REF: ${{ github.ref }}
        run: ./scripts/verify-remote-ref.sh "$EXPECTED_SHA" "$TARGET_REF" "refusing to publish a stale PKGBUILD."

      - name: Publish AUR package
        env:
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          AUR_PACKAGE: ${{ needs.prepare.outputs.aur_package }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          CHANNEL: ${{ inputs.channel }}
          PACKAGE_COMMIT: ${{ needs.prepare.outputs.package_commit }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        run: |
          ./scripts/publish-aur.sh \
            "$AUR_PACKAGE" \
            "Update $CHANNEL to version $PACKAGE_VERSION (commit $PACKAGE_COMMIT)"

      - name: Verify main remained unchanged
        env:
          EXPECTED_SHA: ${{ needs.integrate.outputs.publication_sha }}
          TARGET_REF: ${{ github.ref }}
        run: ./scripts/verify-remote-ref.sh "$EXPECTED_SHA" "$TARGET_REF" "main changed during publication; AUR reconciliation will retry."
