name: Update AUR Nightly Package

on:
  schedule:
    - cron: "20 * * * *" # Run every hour at :20
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish current version to AUR"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/update-aur.yml
    with:
      channel: nightly
      pkgbuild_path: packaging/nightly/PKGBUILD
      aur_package: cursor-nightly-bin
      force_publish: ${{ inputs.force_publish }}
    secrets: inherit
