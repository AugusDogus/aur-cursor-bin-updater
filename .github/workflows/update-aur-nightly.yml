name: Update AUR Nightly Package

on:
  schedule:
    - cron: "20 * * * *" # Run every hour at :20
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish current version to AUR"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/update-aur.yml
    with:
      channel: nightly
      force_publish: ${{ inputs.force_publish }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
      AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
      AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
