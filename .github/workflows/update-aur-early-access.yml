name: Update AUR Early Access Package

on:
  schedule:
    - cron: "10 * * * *" # Run every hour at :10
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish current version to AUR"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/update-aur.yml
    with:
      channel: early-access
      pkgbuild_path: packaging/early-access/PKGBUILD
      aur_package: cursor-early-access-bin
      force_publish: ${{ inputs.force_publish }}
    secrets: inherit
