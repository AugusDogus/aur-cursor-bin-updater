name: Prepare AUR artifacts
description: Stage AUR files and validate local source checksums. Requires prior actions/checkout and Bun on PATH.

inputs:
  channel:
    description: Release channel to stage
    required: true

runs:
  using: composite
  steps:
    - name: Stage AUR files
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
      run: bun scripts/stage-aur.ts --channel "$CHANNEL"

    - name: Verify local source checksums
      shell: bash
      run: |
        bun scripts/verify-local-source-checksums.ts \
          --pkgbuild .aur/PKGBUILD \
          --source .aur/cursor.desktop \
          --source .aur/cursor-launcher.sh
